<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="A minimalist portfolio and blog with project pages written in markdown."
  />
  <meta name="theme-color" content="#f4f0e8" />
  <title>Matthew Yang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
      },
      svg: {
        fontCache: 'global',
      },
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <div>
        <a class="brand" href="#home" aria-label="Home">Matthew Yang</a>
        <p class="site-kicker">minip8</p>
      </div>
      <nav class="site-nav" aria-label="Primary">
        <a href="#home">About</a>
        <a href="#posts">Posts</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme">
          Light
        </button>
      </nav>
    </header>

    <main id="app" class="app" aria-live="polite"></main>

    <footer class="site-footer" id="footer">
      <p>Idk what to put here</p>
      <p class="footer-links"><a href="https://github.com/minip8" target="_blank" rel="noopener noreferrer">GitHub</a> · <a href="mattybsn1340@gmail.com">Email</a></p>
    </footer>
  </div>
</body>
</html>
